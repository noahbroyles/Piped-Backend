name: Publish to GHCR

# Builds the fat jar and publishes a multi-architecture image to ghcr.io/<owner>/<repo>, using only the built in GITHUB_TOKEN (no secrets to configure).
on:
    push:
        paths-ignore:
            - "**.md"
        branches:
            - master
    # Allows publishing by hand from the Actions tab.
    workflow_dispatch:

# A newer run replaces an older one, so that the latest tag cannot end up pointing at an older build.
concurrency:
    group: ghcr-publish-${{ github.ref }}
    cancel-in-progress: true

# The default token is read only, so the publish job below asks for packages: write on its own.
permissions:
    contents: read

jobs:
    # Reuses the same fat jar build as the other workflows, which uploads the piped.jar artifact.
    build-jdk:
        uses: ./.github/workflows/fat-build.yml

    publish:
        needs: build-jdk
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v5
            - uses: actions/download-artifact@v7
              with:
                  name: piped.jar
            # The backend reads this file from its working directory to answer /version.
            - name: Create Version File
              run: echo $(git log -1 --date=short --pretty=format:%cd)-$(git rev-parse --short HEAD) > VERSION
            # GHCR rejects uppercase letters in image names, and the repository name (Piped-Backend) has them.
            - name: Compute image name
              id: image
              run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: Login to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            # Tags the image with latest (default branch only) and with the commit, such as sha-1a2b3c4.
            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ steps.image.outputs.name }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=sha
            # Dockerfile.azul.ci is the variant upstream publishes as 1337kavin/piped:latest.
            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./Dockerfile.azul.ci
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
